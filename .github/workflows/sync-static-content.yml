name: Sync static content

on:
  workflow_run:
    workflows: ['Update Articles']
    branches: [main]
    types: [completed]
  workflow_dispatch:
  # Install-time validation and initial catch-up, without rerunning the collector.
  push:
    branches: [main]
    paths: ['.github/workflows/sync-static-content.yml']

permissions:
  contents: read

concurrency:
  group: sync-static-content
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'karaagetabemasu/mlinfo' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SITE_URL: https://mlinfo.pages.dev
    steps:
      - name: Checkout trusted Pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/static-free-architecture
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Read current successful collector snapshot
        run: |
          git fetch --no-tags --depth=1 origin main
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/collector-sha"
          git show FETCH_HEAD:web/data/articles.json > "$RUNNER_TEMP/incoming-articles.json"
      - name: Preserve previous articles and apply bounded retention
        run: python3 scripts/sync_static_input.py "$RUNNER_TEMP/incoming-articles.json"
      - name: Check for content changes
        id: changes
        run: |
          git add -- web/data/articles.json content/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No content changes; no publication.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test content preservation and rejection of bad snapshots
        if: steps.changes.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned compiler without lifecycle scripts
        if: steps.changes.outputs.changed == 'true'
        working-directory: static-site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and enforce static-only and free-tier budgets
        if: steps.changes.outputs.changed == 'true'
        working-directory: static-site
        run: npm run build
      - name: Publish validated content commit to Pages branch
        if: steps.changes.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'MLinfo Bot'
          git config user.email 'bot@mlinfo.app'
          collector_sha=$(cat "$RUNNER_TEMP/collector-sha")
          git commit -m "chore: sync validated static articles from ${collector_sha:0:12}"
          # Credentials exist only in this step; no force push or unvalidated rebase.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/static-free-architecture
          printf 'Published content from collector `%s`. Cloudflare Git integration builds the static site.\n' "$collector_sha" >> "$GITHUB_STEP_SUMMARY"
          cat build/static-report.json >> "$GITHUB_STEP_SUMMARY"
